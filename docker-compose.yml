services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  web:
    build:
      context: frontend
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
